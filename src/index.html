<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>One Focus</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="bar" aria-label="Window controls">
      <button class="bar__btn" data-action="minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
      <button class="bar__btn" data-action="maximize" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button>
      <button class="bar__btn" data-action="close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </div>
    <div id="date" class="date"></div>
    <time id="clock" class="clock">--:--</time>

    <div class="task">
      <span id="task" class="task__text" tabindex="0" title="Click to set your focus">What are you doing?</span>
      <input id="task-input" class="task__input" type="text" placeholder="What are you doing?" maxlength="120" hidden />
      <span id="since" class="task__since"></span>
    </div>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
